# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# esc timeout
set -g escape-time 0

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour colour2

# copy mode
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# pane borders
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour12 bold'
set -g status-left '#S | '
set -g status-right '#([ #{pane_current_path} = $HOME ] && echo '~' || basename #{pane_current_path}) | #(date +"%b %d") | #(date +%H:%M) '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour12 bold'
setw -g window-status-current-format ' #I: #W'

setw -g window-status-style 'fg=colour4 dim'
setw -g window-status-format ' #I:#[fg=colour4] #W#[fg=colour1]'

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

# messages
set -g message-style 'fg=colour2 bg=colour0 bold'
